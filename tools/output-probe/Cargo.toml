[package]
name = "output-probe"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Opens a host/device, plays a sine and prints the real config, timing, counters and device-thread allocations"

[lints]
workspace = true

[dependencies]
vynamp-output = { path = "../../crates/vynamp-output" }
# Only for the per-thread counting allocator (the allocator itself is declared
# in main.rs as safe code; the `unsafe impl` lives in the testkit).
vynamp-output-testkit = { path = "../../crates/vynamp-output-testkit" }
