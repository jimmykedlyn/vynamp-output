[package]
name = "vynamp-output-testkit"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Test-only helpers for vynamp-output (allocation counter, test render sources)"

# Exception to the workspace `unsafe_code = "forbid"`: only src/alloc.rs needs
# `unsafe impl GlobalAlloc`. This crate is test-only and never published.
[lints.rust]
unsafe_code = "allow"

[dependencies]
# `capture`: the core's Capture tests run through this dev-dependency.
vynamp-output-core = { path = "../vynamp-output-core", features = ["capture"] }
