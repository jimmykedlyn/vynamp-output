# Linux/Docker agent CI: local gate for x86_64-unknown-linux-gnu.
# Part of the Woodpecker CI Gate.
labels:
  host: vynamp-linux

when:
  - event: [push, pull_request, manual]

steps:
  - name: gate
    image: docker.io/library/rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6
    environment:
      CARGO_TERM_COLOR: never
    commands:
      - echo "tested sha=$CI_COMMIT_SHA ref=$CI_COMMIT_REF event=$CI_PIPELINE_EVENT"
      - git rev-parse HEAD
      - rustc --version
      - cargo fmt --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked
      - RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
