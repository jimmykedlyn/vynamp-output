# Aggregate CI Gate. The server publishes this workflow as the GitHub status
# "CI Gate". It only runs when linux and windows succeeded, so a failed or
# cancelled dependency never yields a successful gate.
labels:
  host: vynamp-linux

when:
  - event: [push, pull_request, manual]

depends_on: [linux, windows]

skip_clone: true

steps:
  - name: gate
    image: docker.io/library/rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6
    commands:
      - echo "CI Gate passed for sha=$CI_COMMIT_SHA (linux, windows workflows succeeded)"
      - echo 'NOT VERIFIED - macOS (no Mac agent)'
